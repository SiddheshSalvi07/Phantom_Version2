# GitHub Actions CI to run backend and frontend tests
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations (SQLite)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
      - name: Run tests
        run: |
          cd backend
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install deps and test
        run: |
          cd frontend
          npm ci || npm install
          npm test -- --watchAll=false

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations (SQLite)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
      - name: Start backend
        working-directory: backend
        env:
          WORKER_TOKEN: devworkertoken
          DATABASE_URL: sqlite:///./ci.db
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 2
      - name: Wait for backend
        run: |
          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/docs > /dev/null; then
              echo "Backend is up"; exit 0; fi
            sleep 1
          done
          echo "Backend did not start in time"; exit 1
      - name: Run smoke script
        shell: pwsh
        run: |
          ./scripts/smoke.ps1 -BaseUrl "http://127.0.0.1:8000" -WorkerToken "devworkertoken"
